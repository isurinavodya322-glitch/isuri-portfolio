<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Isuri Navodya Portfolio</title>
  <meta name="theme-color" content="#080710" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%238B5CF6'/><text x='16' y='22' font-family='sans-serif' font-size='16' font-weight='bold' fill='white' text-anchor='middle'>IN</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .error-page-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
    }
    .error-card {
      background: var(--bg-surface);
      border: 1px solid var(--purple-border);
      border-radius: var(--radius-lg);
      padding: 3.5rem 2.5rem;
      max-width: 540px;
      width: 100%;
      box-shadow: var(--shadow-card), var(--shadow-glow);
    }
    .error-code {
      font-size: 5.5rem;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #FFFFFF 10%, var(--purple-light) 60%, var(--purple-accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }
    .error-message {
      font-size: 1.15rem;
      color: var(--text-secondary);
      margin-bottom: 2rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="ambient-glow-wrapper" aria-hidden="true">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
  </div>
  <div class="bg-grid-overlay" aria-hidden="true"></div>

  <main class="error-page-container">
    <div class="error-card">
      <div class="brand-icon" style="margin: 0 auto 1.5rem auto;">IN</div>
      <div class="error-code">404</div>
      <h1 class="section-title" style="font-size: 1.75rem; margin-bottom: 0.75rem;">Page Not Found</h1>
      <p class="error-message">
        The page you are looking for doesn't exist or has been moved. Explore Isuri Navodya's developer portfolio below.
      </p>
      <a href="index.html" class="btn btn-primary">
        <span>Return to Portfolio</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </a>
    </div>
  </main>
</body>
</html>
